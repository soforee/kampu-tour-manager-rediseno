spring:
  application:
    name: lp2_gp2
  datasource:
    # Se pueden sobrescribir con variables de entorno: DB_URL, DB_USERNAME, DB_PASSWORD
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1522/XE}
    username: ${DB_USERNAME:LP2}
    password: ${DB_PASSWORD:admin123}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    open-in-view: false
    hibernate:
      # Las tablas las crea el script db/01_schema.sql; Hibernate NO debe modificarlas
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  servlet:
    context-path: /lp2_gp2
  port: 8082

storage:
  location: "images"

tour:
  # Tipo de cambio a PEN. Deben coincidir con TASAS de frontend_lp2_gp2/src/app/core/utils/moneda.ts
  tasas:
    PEN: 1
    USD: 3.75
    EUR: 4.05
  sesion-horas: 12
